<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>शुभ दीपावली!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&family=Mukta:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#120a2b; --plum:#2a1054; --magenta:#e6368f; --marigold:#ffb627; --saffron:#ff7a1a; --cream:#fff3d6;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:"Mukta","Noto Sans Devanagari",sans-serif; color:var(--cream);
  background:radial-gradient(ellipse at 20% 0%,var(--plum) 0%,var(--night) 70%);
  display:flex; flex-direction:column; min-height:100svh; overflow-x:hidden;
}
#fw{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#blast{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
#flash{position:fixed;inset:0;z-index:49;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash 1.1s ease-out}
#flash.go2{animation:flash2 .6s ease-out}
@keyframes flash2{0%{opacity:.4}100%{opacity:0}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
body.shake{animation:shake .7s}
body.shake2{animation:shake2 .5s}
@keyframes shake2{0%,100%{transform:translate(0)}25%{transform:translate(-6px,4px)}50%{transform:translate(5px,-4px)}75%{transform:translate(-3px,2px)}}
@keyframes shake{
  0%,100%{transform:translate(0)}
  10%{transform:translate(-14px,8px)}20%{transform:translate(12px,-10px)}
  30%{transform:translate(-10px,-6px)}40%{transform:translate(9px,7px)}
  60%{transform:translate(-6px,4px)}80%{transform:translate(4px,-3px)}
}

main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column}
.greet{
  flex:1; padding:max(20px,env(safe-area-inset-top)) clamp(16px,5vw,72px) 20px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px;
}
.title{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,36px)}
.diya{width:clamp(40px,8vw,84px);height:auto;flex:none;filter:drop-shadow(0 0 14px rgba(255,182,39,.8))}
h1{
  font-family:"Tiro Devanagari Marathi","Noto Serif Devanagari",serif; font-weight:400;
  font-size:clamp(2rem,8vw,5.4rem); line-height:1.55; padding:.12em .1em .05em; white-space:nowrap;
  background:linear-gradient(95deg,var(--marigold),var(--saffron) 45%,var(--magenta));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 18px rgba(255,122,26,.35));
}
.greet p{font-size:clamp(1.05rem,2.4vw,1.3rem);line-height:1.7;text-shadow:0 1px 10px var(--night);max-width:34em}
.greet .wish{font-family:"Tiro Devanagari Marathi",serif;font-size:clamp(1.2rem,2.8vw,1.55rem);color:var(--marigold)}
.sign{font-size:1.05rem;color:#ffd9a0;opacity:.55;align-self:flex-end}

.game{
  position:relative; height:min(42svh,340px); min-height:250px; margin-top:auto;
  border-top:2px solid rgba(255,182,39,.45);
  background:linear-gradient(180deg,rgba(42,16,84,.35),rgba(18,10,43,.88));
  box-shadow:0 -10px 40px rgba(230,54,143,.18);
}
#g{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#g.drag{cursor:grabbing}
#count{
  position:absolute;left:50%;top:0;transform:translate(-50%,-50%);z-index:2;pointer-events:none;
  font-family:"Tiro Devanagari Marathi",serif;font-size:4.2rem;line-height:1;color:var(--marigold);
  text-shadow:0 0 24px var(--saffron),0 0 6px #fff;opacity:0
}
#count.on{opacity:1}
</style>
</head>
<body>
<canvas id="fw"></canvas>
<div id="flash"></div>
<canvas id="blast"></canvas>

<main>
  <section class="greet">
    <div class="title">
      <svg class="diya" viewBox="0 0 100 70" aria-hidden="true">
      <path d="M50 4c10 12 12 20 0 30C38 24 40 16 50 4z" fill="#ffb627"/>
      <path d="M50 14c5 7 5 11 0 16-5-5-5-9 0-16z" fill="#fff3d6"/>
      <path d="M6 40h88c0 16-18 26-44 26S6 56 6 40z" fill="#e6368f"/>
      <path d="M6 40h88" stroke="#ffb627" stroke-width="4" stroke-linecap="round"/>
    </svg>
      <h1>शुभ दीपावली!</h1>
      <svg class="diya" viewBox="0 0 100 70" aria-hidden="true">
      <path d="M50 4c10 12 12 20 0 30C38 24 40 16 50 4z" fill="#ffb627"/>
      <path d="M50 14c5 7 5 11 0 16-5-5-5-9 0-16z" fill="#fff3d6"/>
      <path d="M6 40h88c0 16-18 26-44 26S6 56 6 40z" fill="#e6368f"/>
      <path d="M6 40h88" stroke="#ffb627" stroke-width="4" stroke-linecap="round"/>
    </svg>
    </div>
    <p>दिवे उजळू दे, मनं जुळू दे!<br>फटाके तर रोजच उडतात,<br>यंदा तिच्या मनात तुझ्या नावाचा फुलबाजा पेटू दे!</p>
    <p class="wish">दिवाळीच्या हार्दिक शुभेच्छा!</p>
    <p class="sign">Your AJ</p>
  </section>

  <section class="game" aria-label="बॉम्ब गेम">
    <canvas id="g"></canvas>
    <div id="count">5</div>
  </section>
</main>

<script>
(function(){
const rand=(a,b)=>a+Math.random()*(b-a);
const dpr=Math.min(window.devicePixelRatio||1,2);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const HUES=[330,42,28,175,280,50];

/* ---------- Background fireworks (few) ---------- */
const fc=document.getElementById('fw'),fx=fc.getContext('2d');
let FW=0,FH=0,rockets=[],bursts=[];
function fsize(){FW=innerWidth;FH=innerHeight;fc.width=FW*dpr;fc.height=FH*dpr;fx.setTransform(dpr,0,0,dpr,0,0)}
fsize();addEventListener('resize',fsize);
function launch(){
  rockets.push({x:rand(.12,.88)*FW,y:FH,vx:rand(-.5,.5),vy:-rand(7,10)*FH/800,ty:rand(.14,.42)*FH,h:HUES[Math.random()*HUES.length|0]});
}
function explode(r){
  const n=reduce?24:56, base=rand(2.2,4.2);
  for(let i=0;i<n;i++){
    const a=i/n*6.283+rand(-.05,.05), s=base*rand(.55,1);
    bursts.push({x:r.x,y:r.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:rand(.012,.02),h:r.h+rand(-14,14)});
  }
}
(function loop(){
  fx.globalCompositeOperation='destination-out';fx.fillStyle='rgba(0,0,0,.2)';fx.fillRect(0,0,FW,FH);
  fx.globalCompositeOperation='lighter';
  rockets=rockets.filter(r=>{
    r.x+=r.vx;r.y+=r.vy;r.vy+=.05;
    fx.fillStyle='hsl('+r.h+',100%,75%)';fx.fillRect(r.x-1.2,r.y-1.2,2.4,2.4);
    if(r.y<=r.ty||r.vy>-1){explode(r);return false}return true;
  });
  bursts=bursts.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.99;p.l-=p.d;
    if(p.l<=0)return false;
    fx.fillStyle='hsla('+p.h+',100%,62%,'+p.l+')';
    fx.beginPath();fx.arc(p.x,p.y,1.7,0,6.283);fx.fill();return true;
  });
  requestAnimationFrame(loop);
})();
(function next(){
  if(!document.hidden&&rockets.length<2)launch();
  setTimeout(next,rand(reduce?4000:1800,reduce?6000:3300));
})();
setTimeout(launch,500);

/* ---------- Sound ---------- */
const snd=new Audio('blast.mp3');snd.preload='auto';snd.volume=1;snd.loop=true;
let unlocked=false;
function unlock(){
  if(unlocked)return;unlocked=true;
  snd.muted=true;
  const p=snd.play();
  if(p&&p.then)p.then(()=>{snd.pause();snd.currentTime=0;snd.muted=false}).catch(()=>{snd.muted=false});
}
function synthBoom(){ /* fallback if blast.mp3 is missing */
  try{
    const AC=window.AudioContext||window.webkitAudioContext,ac=new AC();
    const len=ac.sampleRate*1.6,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);
    const n=ac.createBufferSource();n.buffer=buf;
    const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
    const g=ac.createGain();g.gain.value=1;
    n.connect(f);f.connect(g);g.connect(ac.destination);n.start();
    const o=ac.createOscillator(),og=ac.createGain();
    o.frequency.setValueAtTime(110,ac.currentTime);o.frequency.exponentialRampToValueAtTime(30,ac.currentTime+.6);
    og.gain.setValueAtTime(1,ac.currentTime);og.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.8);
    o.connect(og);og.connect(ac.destination);o.start();o.stop(ac.currentTime+.9);
  }catch(e){}
}
function playBoom(){
  snd.currentTime=0;snd.volume=1;snd.muted=false;snd.loop=true;
  const p=snd.play();
  if(p&&p.catch)p.catch(()=>{synthBoom();setInterval(synthBoom,1700)});
}

/* ---------- Full-screen blast (endless loop) ---------- */
const bc=document.getElementById('blast'),bx=bc.getContext('2d'),flash=document.getElementById('flash');
function bigBlast(){
  let W,H;
  function rs(){W=innerWidth;H=innerHeight;bc.width=W*dpr;bc.height=H*dpr;bx.setTransform(dpr,0,0,dpr,0,0)}
  rs();addEventListener('resize',rs);
  const ps=[],rings=[];
  let nextAt=0,first=true;
  function kick(cls,fcls){
    flash.className='';void flash.offsetWidth;flash.className=fcls;
    document.body.classList.remove('shake','shake2');void document.body.offsetWidth;document.body.classList.add(cls);
  }
  function explode(cx,cy,now){
    for(let i=0;i<220;i++){
      const a=rand(0,6.283),s=rand(2,20);
      ps.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:rand(.008,.018),h:rand(0,60)+(Math.random()<.3?290:0),r:rand(2,6)});
    }
    rings.push({x:cx,y:cy,t:now});
    kick(first?'shake':'shake2',first?'go':'go2');first=false;
  }
  (function f(now){
    if(now>=nextAt){
      explode(nextAt===0?W/2:rand(.1,.9)*W,nextAt===0?H/2:rand(.12,.88)*H,now);
      nextAt=now+rand(900,1500);
    }
    bx.clearRect(0,0,W,H);
    bx.globalCompositeOperation='lighter';
    for(let i=rings.length-1;i>=0;i--){
      const r=rings[i],k=(now-r.t)/1500;
      if(k>1){rings.splice(i,1);continue}
      const rad=Math.hypot(W,H)*k*.9;
      bx.strokeStyle='hsla('+(40-k*30)+',100%,70%,'+(1-k)+')';
      bx.lineWidth=24*(1-k)+2;bx.beginPath();bx.arc(r.x,r.y,rad,0,6.283);bx.stroke();
      if(k<.3){
        const g=bx.createRadialGradient(r.x,r.y,0,r.x,r.y,W*.35*(k/.3+.2));
        g.addColorStop(0,'rgba(255,255,230,'+(1-k/.3)+')');g.addColorStop(.5,'rgba(255,150,30,'+(.7-k*2)+')');g.addColorStop(1,'rgba(255,60,0,0)');
        bx.fillStyle=g;bx.fillRect(0,0,W,H);
      }
    }
    for(let i=ps.length-1;i>=0;i--){
      const p=ps[i];
      p.x+=p.vx;p.y+=p.vy;p.vy+=.16;p.vx*=.985;p.vy*=.985;p.l-=p.d;
      if(p.l<=0){ps.splice(i,1);continue}
      bx.fillStyle='hsla('+p.h+',100%,'+(50+p.l*25)+'%,'+p.l+')';
      bx.beginPath();bx.arc(p.x,p.y,p.r*p.l+.5,0,6.283);bx.fill();
    }
    requestAnimationFrame(f);
  })(0);
}

/* ---------- Game ---------- */
const gc=document.getElementById('g'),gx=gc.getContext('2d');
const countEl=document.getElementById('count');
let W=0,H=0,R=50,bomb={x:0,y:0},fuse={},lit={nx:.16,ny:.68},
    state='idle',dragging=false,grab={x:0,y:0},t0=0,sparks=[],gone=false;
function gsize(){
  const r=gc.getBoundingClientRect();W=r.width;H=r.height;
  gc.width=W*dpr;gc.height=H*dpr;gx.setTransform(dpr,0,0,dpr,0,0);
  R=Math.max(30,Math.min(H*.2,52));
  bomb={x:W*(W<520?.7:.72),y:H*.66};
  fuse={cx:bomb.x+R*.45,cy:bomb.y-R*.88,qx:bomb.x+R*.55,qy:bomb.y-R*1.55,tx:bomb.x+R*1.15,ty:bomb.y-R*1.4};
}
gsize();addEventListener('resize',gsize);
const lpos=()=>({x:lit.nx*W,y:lit.ny*H});
const tip=()=>{const p=lpos();return{x:p.x,y:p.y-58}};
const LW=36,LH=72;

function addSparks(x,y,n,sp){
  for(let i=0;i<n;i++){const a=rand(0,6.283),s=rand(.5,sp);
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-rand(0,1.5),l:1,d:rand(.03,.07)})}
}
function drawBomb(pulse){
  const s=1+pulse;
  gx.save();gx.translate(bomb.x,bomb.y);gx.scale(s,s);gx.translate(-bomb.x,-bomb.y);
  const g=gx.createRadialGradient(bomb.x-R*.35,bomb.y-R*.4,R*.1,bomb.x,bomb.y,R);
  g.addColorStop(0,'#5b4a8a');g.addColorStop(.45,'#251a45');g.addColorStop(1,'#08050f');
  gx.fillStyle=g;gx.beginPath();gx.arc(bomb.x,bomb.y,R,0,6.283);gx.fill();
  gx.strokeStyle='rgba(255,255,255,.35)';gx.lineWidth=3;gx.beginPath();gx.arc(bomb.x,bomb.y,R*.78,3.5,4.3);gx.stroke();
  gx.fillStyle='#ffb627';gx.beginPath();gx.roundRect(bomb.x+R*.1,bomb.y-R*1.02,R*.7,R*.2,4);gx.fill();
  gx.strokeStyle='#e8c98a';gx.lineWidth=4;gx.lineCap='round';
  gx.beginPath();gx.moveTo(fuse.cx,fuse.cy);gx.quadraticCurveTo(fuse.qx,fuse.qy,fuse.tx,fuse.ty);gx.stroke();
  gx.restore();
}
function drawEmber(on){
  const r=on?9:5,g=gx.createRadialGradient(fuse.tx,fuse.ty,0,fuse.tx,fuse.ty,r*2.4);
  g.addColorStop(0,on?'#fff':'#a05a20');g.addColorStop(.4,on?'#ffb627':'rgba(160,90,32,.4)');g.addColorStop(1,'rgba(255,122,26,0)');
  gx.fillStyle=g;gx.beginPath();gx.arc(fuse.tx,fuse.ty,r*2.4,0,6.283);gx.fill();
}
function drawLighter(now){
  const p=lpos(),k=dragging?1.25:.9,fl=k*(1+Math.sin(now/55)*.12);
  gx.save();gx.translate(p.x,p.y);
  gx.shadowColor='rgba(0,0,0,.5)';gx.shadowBlur=12;
  const g=gx.createLinearGradient(-LW/2,0,LW/2,0);
  g.addColorStop(0,'#c21d72');g.addColorStop(.5,'#ff5fae');g.addColorStop(1,'#a3155f');
  gx.fillStyle=g;gx.beginPath();gx.roundRect(-LW/2,-LH/2+8,LW,LH-8,8);gx.fill();gx.shadowBlur=0;
  gx.fillStyle='#ffb627';gx.fillRect(-LW/2,-LH/2+26,LW,5);
  gx.fillStyle='#cfd3dc';gx.beginPath();gx.roundRect(-LW/2+3,-LH/2-2,LW-6,12,3);gx.fill();
  gx.fillStyle='#4a4f5c';gx.fillRect(-4,-LH/2-8,8,8);
  const fy=-LH/2-8;
  const fg=gx.createRadialGradient(0,fy-12*fl,1,0,fy-12*fl,22*fl);
  fg.addColorStop(0,'#fff');fg.addColorStop(.35,'#ffd24a');fg.addColorStop(.7,'rgba(255,100,20,.8)');fg.addColorStop(1,'rgba(255,60,0,0)');
  gx.fillStyle=fg;gx.beginPath();gx.ellipse(0,fy-14*fl,9*fl,20*fl,0,0,6.283);gx.fill();
  gx.restore();
}
function drawArrow(now){
  const p=lpos(),dx=fuse.tx-p.x,dy=fuse.ty-p.y,a=Math.atan2(dy,dx);
  if(Math.hypot(dx,dy)<90)return;
  const off=56+Math.sin(now/260)*6;
  gx.save();gx.translate(p.x+Math.cos(a)*off,p.y+Math.sin(a)*off);gx.rotate(a);
  gx.globalAlpha=.5;gx.fillStyle='#ffffff';gx.shadowColor='rgba(255,255,255,.6)';gx.shadowBlur=8;
  gx.beginPath();gx.moveTo(18,0);gx.lineTo(2,-11);gx.lineTo(2,-4);gx.lineTo(-16,-4);gx.lineTo(-16,4);gx.lineTo(2,4);gx.lineTo(2,11);gx.closePath();gx.fill();
  gx.restore();
}
function ignite(){
  state='burning';t0=performance.now();dragging=false;gc.classList.remove('drag');
  addSparks(fuse.tx,fuse.ty,30,4.5);
  countEl.classList.add('on');
}
function boom(){
  state='boom';gone=true;countEl.classList.remove('on');
  playBoom();
  bigBlast();
}

function frame(now){
  gx.clearRect(0,0,W,H);
  let pulse=0;
  if(state==='burning'){
    const el=(now-t0)/1000,left=5-el;
    if(left<=0){boom()}
    else{
      countEl.textContent=Math.ceil(left);
      pulse=Math.max(0,.05-((el%1))*.08);
      addSparks(fuse.tx,fuse.ty,2,2.6);
    }
  }
  if(!gone)drawBomb(pulse);
  if(!gone)drawEmber(state==='burning');
  sparks=sparks.filter(s=>{
    s.x+=s.vx;s.y+=s.vy;s.vy+=.08;s.l-=s.d;if(s.l<=0)return false;
    gx.fillStyle='rgba(255,'+(150+s.l*90|0)+',60,'+s.l+')';
    gx.beginPath();gx.arc(s.x,s.y,1.8*s.l+.4,0,6.283);gx.fill();return true;
  });
  if(!gone)drawLighter(now);
  if(state==='idle')drawArrow(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function pt(e){const r=gc.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
gc.addEventListener('pointerdown',e=>{
  if(state!=='idle')return;
  unlock();
  const p=pt(e),l=lpos();
  if(Math.abs(p.x-l.x)<LW/2+22&&p.y>l.y-LH/2-34&&p.y<l.y+LH/2+22){
    dragging=true;grab={x:p.x-l.x,y:p.y-l.y};gc.classList.add('drag');gc.setPointerCapture(e.pointerId);
  }
});
gc.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const p=pt(e);
  const x=Math.max(LW,Math.min(W-LW,p.x-grab.x)),y=Math.max(LH/2+62,Math.min(H-LH/2-6,p.y-grab.y));
  lit={nx:x/W,ny:y/H};
  const t=tip();
  if(Math.hypot(t.x-fuse.tx,t.y-fuse.ty)<30)ignite();
});
const stop=()=>{dragging=false;gc.classList.remove('drag')};
gc.addEventListener('pointerup',stop);gc.addEventListener('pointercancel',stop);
})();
</script>
</body>
</html>
